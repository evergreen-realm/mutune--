name: Deploy MutuneRent Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd backend && npm install
      - run: cd backend && npm test -- --runInBand
      - run: cd backend && npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and Poll Render Deploy
        run: |
          response=$(curl -s -f -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys)
          
          deploy_id=$(echo "$response" | jq -r '.id')
          echo "Triggered deploy ID: $deploy_id"
          
          if [ "$deploy_id" = "null" ] || [ -z "$deploy_id" ]; then
            echo "Error: Failed to trigger deploy. Response: $response"
            exit 1
          fi
          
          while true; do
            status_response=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id)
            
            status=$(echo "$status_response" | jq -r '.status')
            echo "Deploy status: $status"
            
            if [ "$status" = "live" ]; then
              echo "Deployment succeeded!"
              break
            elif [ "$status" = "deactivated" ] || [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
              echo "Deployment failed with status: $status"
              exit 1
            fi
            
            sleep 15
          done

  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Install frontend deps
        run: cd frontend && npm install --legacy-peer-deps
      # Pull Vercel project settings (does NOT overwrite .env.production)
      - name: Pull Vercel project settings
        run: cd frontend && vercel pull --yes --environment production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Build locally — uses committed frontend/.env.production for VITE_* vars
      - name: Build with Vercel
        run: cd frontend && vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Deploy prebuilt output — no remote build, no dashboard env var override
      - name: Deploy prebuilt to Vercel
        run: cd frontend && vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
