name: Deploy MutuneRent Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd backend && npm install
      - run: cd backend && npm test -- --runInBand
      - run: cd backend && npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Configure and Verify Render Env Vars
        run: |
          echo "Setting CLERK_PUBLISHABLE_KEY on Render..."
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"value": "pk_test_Y29zbWljLWtvYWxhLTgwLmNsZXJrLmFjY291bnRzLmRldiQ"}' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars/CLERK_PUBLISHABLE_KEY
          
          echo "Fetching env vars to verify..."
          response=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars)
          echo "Render Env Vars (masked):"
          echo "$response" | jq -r '.[] | "\(.envVar.key): \(.envVar.value | .[0:4])...\(.envVar.value | .[-4:])"' || echo "$response"
      - name: Trigger and Poll Render Deploy
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -w "\nHTTP_STATUS:%{http_code}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys)
          
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS:")
          
          echo "Render API Response Status: $http_status"
          echo "Render API Response Body: $body"
          
          deploy_id=$(echo "$body" | jq -r '.id' 2>/dev/null || echo "null")
          
          if [ "$deploy_id" = "null" ] || [ -z "$deploy_id" ]; then
            echo "Response did not contain deploy ID. Fetching latest deploy from the service deploys list..."
            sleep 3
            list_response=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1")
            echo "Deploys List Response: $list_response"
            deploy_id=$(echo "$list_response" | jq -r '.[0].deploy.id')
          fi
          
          echo "Using Deploy ID: $deploy_id"
          
          if [ "$deploy_id" = "null" ] || [ -z "$deploy_id" ]; then
            echo "Error: Failed to retrieve a valid deploy ID."
            exit 1
          fi
          
          while true; do
            status_response=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id)
            
            status=$(echo "$status_response" | jq -r '.status')
            echo "Deploy status: $status"
            
            if [ "$status" = "live" ]; then
              echo "Deployment succeeded!"
              break
            elif [ "$status" = "deactivated" ] || [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
              echo "Deployment failed with status: $status"
              exit 1
            fi
            
            sleep 15
          done

  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Install frontend deps
        run: cd frontend && npm install --legacy-peer-deps
      # Pull Vercel project settings (does NOT overwrite .env.production)
      - name: Pull Vercel project settings
        run: cd frontend && vercel pull --yes --environment production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Copy Vercel env to root so Vite loads them during local/CI build
      - name: Copy Vercel env to root
        run: cp frontend/.vercel/.env.production.local frontend/.env.production.local

      # Build locally — uses committed frontend/.env.production for VITE_* vars
      - name: Build with Vercel
        run: cd frontend && vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: https://mutunerent-api.onrender.com/api/v1
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y29zbWljLWtvYWxhLTgwLmNsZXJrLmFjY291bnRzLmRldiQ
      # Deploy prebuilt output — no remote build, no dashboard env var override
      - name: Deploy prebuilt to Vercel
        run: cd frontend && vercel deploy --prebuilt --prod --yes --no-wait --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
