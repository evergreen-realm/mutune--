version: "1"
services:
  - type: web
    name: mutunerent-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # All secrets below use sync: false — Render will prompt for values during initial Blueprint creation
      # After creation, update values via Render Dashboard → Environment
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MAX_TOKENS
        value: "1024"
      - key: GROQ_TEMPERATURE
        value: "0.3"
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_API_URL
        value: https://api.moonshot.ai/v1/chat/completions
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: AT_FROM
        value: MutuneRent
      - key: AT_USSD_SHORTCODE
        sync: false
      - key: PLUS_CODE_REGION
        value: KE
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: mutune
      - key: CLOUDFLARE_R2_PIPELINE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_PIPELINE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_PIPELINE_BUCKET
        value: mutune-pipeline
      - key: MODAL_BLENDER_WEBHOOK_URL
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        value: https://mutune-alpha.vercel.app
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_HARDCODED_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MODAL_3D_SPLAT_WEBHOOK_URL
        sync: false
      - key: MODAL_WEBHOOK_SECRET
        sync: false
      - key: KYANDA_API_KEY
        sync: false
      - key: KYANDA_API_URL
        value: https://api.kyanda.africa/v1
      - key: KYANDA_MERCHANT_ID
        sync: false
      - key: KRA_ETIMS_PIN
        sync: false
      - key: KRA_ETIMS_DEVICE_SERIAL
        sync: false
      - key: KRA_ETIMS_CLIENT_SECRET
        sync: false
      - key: KRA_ETIMS_BASE_URL
        value: https://etims.kra.go.ke/etims-api/v1
      - key: KRA_ETIMS_ENV
        value: production
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_B2C_SHORTCODE
        value: "600986"
      - key: DARAJA_B2C_INITIATOR
        value: testapi
      - key: DARAJA_B2C_PASSWORD
        sync: false
      - key: DARAJA_ENV
        value: sandbox
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_SECRET_KEY
        sync: false
      - key: INTASEND_ENVIRONMENT
        value: sandbox
      - key: MPESA_INITIATOR_NAME
        value: testapi
      - key: MPESA_INITIATOR_PASSWORD
        sync: false

    healthCheckPath: /api/v1/health
