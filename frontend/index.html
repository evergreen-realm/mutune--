<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>MutuneRent Pro — Coastal Property Management | Mombasa, Kenya</title>
  <meta name="description" content="Premium property management for Mombasa's coast. 3D spatial blueprints, automated KRA tax filing, instant M-Pesa rent collection. For landlords, tenants, and EARB-licensed agents." />
  <meta name="keywords" content="property management, Mombasa, Kenya, M-Pesa, rent collection, real estate, Mutune Estate" />
  <meta name="author" content="Mutune Estate Agency" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="MutuneRent Pro" />
  <meta property="og:description" content="Property Management System — Mombasa Estate Agency" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/hero_coastal_building.png" />
  <meta property="og:locale" content="en_KE" />

  <!-- Favicon (inline SVG as data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2316a34a'/><text y='.9em' font-size='65' x='12' font-family='sans-serif' font-weight='900' fill='white'>MR</text></svg>" />

  <!-- Leaflet CSS (map widget) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="anonymous"
  />

  <!-- Google Fonts: Inter (primary) + Fira Code (monospace for receipts/codes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Theme colour for mobile browsers -->
  <meta name="theme-color" content="#16a34a" />

  <!-- Prevent FOUC (flash of unstyled content) by immediately applying dark mode class -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('mutunerent-theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "MutuneRent Pro",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Property management platform for coastal Kenya with 3D visualization, KRA tax automation, and M-Pesa integration.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KES" }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
